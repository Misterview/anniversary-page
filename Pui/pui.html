    // โค้ดสำหรับ auto focus และตรวจสอบรหัส
    const inputs = document.querySelectorAll('.code-input');
    inputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
        checkCode();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          inputs[idx - 1].focus();
        }
      });
    });

        const durationEl = document.getElementById('duration');
        let isPlaying = false;
        playBtn.addEventListener('click', () => {
          if (audio.paused) {
            audio.play();
            playBtn.innerHTML = '&#10073;&#10073;'; // pause icon
          } else {
            audio.pause();
            playBtn.innerHTML = '&#9654;'; // play icon
          }
        });
        audio.addEventListener('play', () => { isPlaying = true; playBtn.innerHTML = '&#10073;&#10073;'; });
        audio.addEventListener('pause', () => { isPlaying = false; playBtn.innerHTML = '&#9654;'; });
        audio.addEventListener('timeupdate', () => {
          progressBar.value = Math.floor(audio.currentTime);
          currentTimeEl.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
          progressBar.max = Math.floor(audio.duration);
          durationEl.textContent = formatTime(audio.duration);
        });
        progressBar.addEventListener('input', () => {
          audio.currentTime = progressBar.value;
        });
        function formatTime(sec) {
          const m = Math.floor(sec / 60);
          const s = Math.floor(sec % 60);
          return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
