    body {

    .container {

      position: absolute;
      left: -40px;
      top: -30px;

    }
    .title .star2 {

      font-size: 40px;
      position: absolute;
      right: -40px;
      top: -30px;

    @keyframes twinkle {

    @keyframes glow { from { text-shadow: 0 0 10px rgba(74, 74, 74, 0.3); } to { text-shadow: 0 0 30px rgba(74, 74, 74, 0.5); } }

      margin-top: 30px;
      gap: 10px;

      transform: scale(0.95);

      }

        height: 60px;
      }

    .floating-left {
      animation: floatLeft 3s ease-in-out infinite;

    .floating-main {
      animation: floatMain 4s ease-in-out infinite;
    }
    .floating-right {
      animation: floatRight 3s ease-in-out infinite;

    @keyframes floatLeft {
      0%, 100% { transform: rotate(-10deg) translateY(0); }
      50% { transform: rotate(-15deg) translateY(-10px); }

    @keyframes floatMain {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-15px) scale(1.05); }
    }
    @keyframes floatRight {
      0%, 100% { transform: rotate(10deg) translateY(0); }
      50% { transform: rotate(15deg) translateY(-10px); }

    .img-small, .img-main, .img-small2 {
      transition: all 0.3s ease;
    }
    .img-small:hover, .img-small2:hover {
      transform: scale(1.2) rotate(0deg) !important;
      z-index: 10;
    }
    .img-main:hover {
      transform: scale(1.1) !important;
      z-index: 10;
    }
    .title, .subtitle, .naming {

      transform: translateY(20px);
      animation: fadeInUp 0.8s ease forwards;
    }
    .title { animation-delay: 0.2s; }
    .subtitle { animation-delay: 0.4s; }
    .naming { animation-delay: 0.6s; }
    
    .images {
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.8s;

    .blessing-box {

      color: #333 !important;
      box-shadow: 0 8px 32px #e0e0e0;
    }
    .blessing-star {
      color: #bdbdbd !important;
    }

        opacity: 0;
        transform: translateY(20px);
      }
      to {

      }

      from { opacity: 0; }
      to { opacity: 1; }

    .title .star2 {
      animation-delay: 1s;
    }
    
    .blessing-star {
      animation: starFloat 3s infinite alternate;
    }
    
    @keyframes starFloat {
      0% { transform: translateY(0) rotate(-10deg); }
      100% { transform: translateY(-10px) rotate(10deg); }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .modal.show {
      display: flex;
      opacity: 1;
    }
    
    .modal-content {
      max-width: 90%;
      max-height: 90vh;
      margin: auto;
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }
    
    .modal.show .modal-content {
      transform: scale(1);
    }
    
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 30px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    
    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }
    /* Floating hearts */
    .floating-heart { position: fixed; pointer-events: none; z-index: 9999; animation: floatHeart 4s linear forwards; }
    @keyframes floatHeart { 0%{transform:translateY(100vh) scale(0.7);opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(-100px) scale(1.1);opacity:0;} }
    /* Ripple */
    .music-btn { position: relative; overflow: hidden; }
    .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0); animation: ripple 0.6s linear; pointer-events: none; }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
    body, .title, .subtitle, .naming, .music-title, .music-artist, .music-time, .blessing-message, .memories-title, .memories-desc, .memories-message, .code-input, .music-btn {

    .confetti-piece {

            function updateSlideshow() {
                const prevIndex = (currentIndex - 1 + images.length) % images.length;
                const nextIndex = (currentIndex + 1) % images.length;
                
                const smallImg = slideshowContainer.querySelector('.img-small');

            if (prevBtn && nextBtn) {
                prevBtn.addEventListener('click', () => {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;

                    currentIndex = (currentIndex + 1) % images.length;

              }

              progressBar.value = Math.floor(audio.currentTime);
              currentTimeEl.textContent = formatTime(audio.currentTime);
            });
            audio.addEventListener('loadedmetadata', () => {
              progressBar.max = Math.floor(audio.duration);
              durationEl.textContent = formatTime(audio.duration);

            progressBar.addEventListener('input', () => {
              audio.currentTime = progressBar.value;

            function formatTime(sec) {
              const m = Math.floor(sec / 60);

  <div id="imageModal" class="modal">
    <span class="modal-close">&times;</span>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // Existing code...
    
    // Modal functionality
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const closeBtn = document.querySelector('.modal-close');
    
    // Open modal
    document.querySelectorAll('.show-modal').forEach(img => {
      img.addEventListener('click', function() {
        modal.classList.add('show');
        modalImg.src = this.src;
        document.body.style.overflow = 'hidden'; // Prevent scrolling
      });
    });
    
    // Close modal
    function closeModal() {
      modal.classList.remove('show');
      document.body.style.overflow = ''; // Restore scrolling
    }
    
    closeBtn.addEventListener('click', closeModal);
    
    // Close when clicking outside the image
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });
    
    // Close with escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.classList.contains('show')) {
        closeModal();
      }
    });
    
    // Add zoom effect on hover
    modalImg.addEventListener('mousemove', function(e) {
      const rect = this.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      
      this.style.transformOrigin = `${x * 100}% ${y * 100}%`;
    });
    
    // Reset zoom on mouse leave
    modalImg.addEventListener('mouseleave', function() {
      this.style.transformOrigin = 'center';
    });
  });
  </script>
